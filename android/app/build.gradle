plugins {
  // AGP 9 compiles Kotlin itself; applying org.jetbrains.kotlin.android on top of it is now an
  // error rather than a no-op (see https://kotl.in/gradle/agp-built-in-kotlin).
  id 'com.android.application'
}

kotlin {
  jvmToolchain(21)
  // AGP 9 removed android.kotlinOptions; the compiler is configured through the Kotlin
  // extension instead.
  compilerOptions {
    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    freeCompilerArgs.add('-jvm-default=enable')
  }
}

// Version identity for the build.
//
// Both now live in variables.gradle, so the wear module - which ships under the same
// applicationId and must carry the same numbers - reads the one definition.
def podshelfVersionCode = rootProject.ext.podshelfVersionCode
def podshelfVersionName = rootProject.ext.podshelfVersionName

android {
  namespace = 'com.audiobookshelf.app'
  buildFeatures {
    viewBinding = true
    buildConfig = true
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_21
    targetCompatibility JavaVersion.VERSION_21
  }
  lint {
    abortOnError = false
    warningsAsErrors = false
    checkDependencies = false
    disable 'GradleDependency'
    baseline = file('lint-baseline.xml')
  }
  compileSdk rootProject.ext.compileSdkVersion
  signingConfigs {
    debug {
      storeFile rootProject.file('debug.keystore')
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
    // The upload key for Play. Populated from the environment by
    // .github/workflows/publish-play.yml, which decodes it from a secret; left empty on a
    // laptop, where a release build still configures and simply comes out unsigned. Nothing
    // about the key is in the repository.
    release {
      def keystorePath = System.getenv('PODSHELF_KEYSTORE_PATH')
      if (keystorePath) {
        storeFile file(keystorePath)
        storePassword System.getenv('PODSHELF_KEYSTORE_PASSWORD')
        keyAlias System.getenv('PODSHELF_KEY_ALIAS')
        keyPassword System.getenv('PODSHELF_KEY_PASSWORD')
      }
    }
  }
  defaultConfig {
    applicationId "com.podshelf.app"
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion

    // Resolved above, into locals, because `versionCode (a ?: b).toInteger()` is parsed by
    // Groovy as `versionCode(a ?: b).toInteger()` - the method call binds tighter than the
    // elvis - which hands AGP a String and fails the whole evaluation with "Value is null".
    versionCode podshelfVersionCode
    versionName podshelfVersionName
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    manifestPlaceholders = [
      "appAuthRedirectScheme": "com.podshelf.app"
    ]
  }
  androidResources {
    // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
    // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
    // AGP 9.x: replaces aaptOptions.ignoreAssetsPattern (String) with ignoreAssetsPatterns (Set<String>)
    ignoreAssetsPatterns.addAll(['!.svn', '!.git', '!.ds_store', '!*.scc', '.*', '!CVS', '!thumbs.db', '!picasa.ini', '!*~'])
  }
  buildTypes {
    debug {
      applicationIdSuffix ".debug"
      versionNameSuffix "-debug"
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
    release {
      // Only attached when the key is actually present. Wiring it unconditionally would make
      // every release build fail on a machine without the secrets, including a plain
      // `./gradlew assembleRelease` someone runs to check something compiles.
      if (System.getenv('PODSHELF_KEYSTORE_PATH')) {
        signingConfig signingConfigs.release
      }
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }
}

repositories {
  flatDir {
    dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
  }
  mavenCentral()
}

configurations.configureEach {
  resolutionStrategy {
    force("com.google.android.gms:play-services-base:18.0.1")
    force("androidx.appcompat:appcompat:$androidxAppCompatVersion")
    force("androidx.core:core-ktx:$androidx_core_ktx_version")
    force("androidx.media:media:$androidx_media_version")
    force("org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlin_coroutines_version")
    force("org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlin_coroutines_version")
  }
}

dependencies {
  implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
  implementation fileTree(include: ['*.jar'], dir: 'libs')
  implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
  implementation project(':capacitor-android')

  implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
  implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"

  if (findProject(':capacitor-cordova-android-plugins') != null) {
    implementation project(':capacitor-cordova-android-plugins')
  }

  implementation "androidx.core:core-ktx:$androidx_core_ktx_version"

  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlin_coroutines_version"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlin_coroutines_version"

  implementation "androidx.media:media:$androidx_media_version"

  // WorkManager - schedules the incomplete-download cleanup pass
  implementation "androidx.work:work-runtime-ktx:$androidx_work_version"

  // WindowManager - reports the hinge on a foldable, for tabletop and book postures
  implementation "androidx.window:window:$androidx_window_version"

  // Wearable Data Layer - publishes the session and the resolved queue to the watch
  implementation "com.google.android.gms:play-services-wearable:$play_services_wearable_version"
  implementation project(':wear-sync')

  // Lifecycle - MainActivity's repeatOnLifecycle. Declared rather than relied on transitively:
  // it used to arrive through appcompat, which AGP 9 no longer leaks onto the compile classpath.
  implementation "androidx.lifecycle:lifecycle-runtime-ktx:$androidx_lifecycle_version"

  // Media3 (replaces ExoPlayer 2 — see android/media3-migration branch)
  implementation "androidx.media3:media3-exoplayer:$media3_version"
  implementation "androidx.media3:media3-exoplayer-hls:$media3_version"
  implementation "androidx.media3:media3-session:$media3_version"
  implementation "androidx.media3:media3-ui:$media3_version"
  implementation "androidx.media3:media3-cast:$media3_version"

  // Glide for images (no annotation processor needed — GlideApp generated API unused)
  implementation "com.github.bumptech.glide:glide:$glide_version"

  // Paper NoSQL Db
  implementation 'io.github.pilgr:paperdb:2.7.2'

  // Simple Storage
  implementation "com.anggrayudi:storage:1.5.6"

  // OK HTTP
  implementation "com.squareup.okhttp3:okhttp:$okhttp_version"

  // Jackson for JSON
  implementation "com.fasterxml.jackson.module:jackson-module-kotlin:$jackson_version"

  testImplementation "org.robolectric:robolectric:4.13"
  testImplementation "junit:junit:$junit_version"
}

tasks.register('staticAnalysis') {
  group = 'verification'
  description = 'Runs static analysis checks.'
  dependsOn('lint')
}

tasks.named('check') {
  dependsOn('staticAnalysis')
}

apply from: 'capacitor.build.gradle'

// scripts/test-android.sh runs every module's test task in one invocation, so a `--tests`
// filter naming a class in another module must not fail this one.
tasks.withType(Test).configureEach {
  filter {
    failOnNoMatchingTests = false
  }
}
