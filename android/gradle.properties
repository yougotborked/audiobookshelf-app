# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
#org.gradle.jvmargs=-Xmx1536m
org.gradle.jvmargs=-Dfile.encoding=UTF-8 \
                   --add-opens jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED \
                   --add-opens jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
                   --add-opens jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED \
                   --add-opens jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED  \
                   --add-opens jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED \
                   --add-opens jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED \
                   --add-opens jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

kapt.use.worker.api=false

android.buildfeatures.buildconfig=true

org.gradle.warning.mode=summary
org.gradle.java.installations.auto-download=true

# Centralize Android Gradle Plugin version so generated projects can stay in sync
agpVersion=9.4.1

# AGP 9 turned `getDefaultProguardFile('proguard-android.txt')` from a no-op into a hard error,
# because that file carries `-dontoptimize`. Our own modules use the -optimize variant.
#
# Capacitor 8 cleared almost all of this. It was a dozen plugin build files under node_modules/;
# it is now exactly one, and it is not an official plugin:
#
#   node_modules/@capacitor-community/volume-buttons/android/build.gradle
#
# Verified by removing this line and building - the only failure left is that file. It is not
# ours to edit, so the check stays off; it changes nothing for Podshelf, whose :app does not
# enable minification on either build type.
#
# Remove this once volume-buttons ships a build file that does not call the removed default -
# or once its two uses are replaced, which is a smaller job than it was when a dozen plugins
# needed it.
android.r8.proguardAndroidTxt.disallowed=false

