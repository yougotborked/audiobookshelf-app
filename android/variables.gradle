ext {
    // The version, supplied by whatever is driving the build.
    //
    // scripts/app-version.sh derives it from the newest release tag; CI and the publish workflow
    // both export it before Gradle runs. Reading git from here looked obvious and could not
    // work: `providers.exec` registers a value source that the configuration cache re-evaluates
    // when it stores the entry, outside any try/catch, so a shallow clone with no tags - which
    // is what CI checks out by default - failed the whole build with "non-zero exit value 128".
    //
    // Play rejects a versionCode it has seen before and will not go backwards, so this has to
    // move forward on every upload. Deriving it from the tag keeps it monotonic and
    // reproducible rather than depending on a counter that resets when a workflow is renamed.
    //
    // The fallback is deliberately an obviously wrong version rather than a plausible stale one.
    // Nobody reports "0.0.0-untagged" and wonders why their fix is missing, which is exactly
    // what 0.12.0-beta did for weeks after 0.13.0 shipped.
    //
    // Hoisted here rather than left in app/build.gradle because the wear module ships under the
    // same applicationId and derives its own code from this one.
    // 1 rather than 0 for the fallback: AGP rejects a versionCode of 0 outright, so a bare
    // `./gradlew assembleDebug` with nothing exported failed to configure at all. CI always
    // exports one, which is exactly why that went unnoticed until a local build hit it.
    podshelfVersionCode = (System.getenv('PODSHELF_VERSION_CODE') ?: '1') as Integer
    podshelfVersionName = (System.getenv('PODSHELF_VERSION_NAME') ?: '0.0.0-untagged') as String

    // The watch's version code, which must NOT collide with any phone code, ever.
    //
    // Play treats the two artifacts as one listing with several device targets, and a version
    // code has to be unique across every form factor in the app - two bundles sharing one is
    // simply rejected. Higher than the phone's as well as different, because a watch can match
    // the phone artifact too and Play hands a device the highest code it qualifies for.
    //
    // A constant offset rather than a separate counter: it keeps the watch's codes increasing
    // exactly as often as the phone's, so neither can quietly fall behind its own last release,
    // and the phone code is still readable inside it.
    //
    // The offset has to clear the phone's whole *range*, not just its current value. It was
    // 1_000_000, which was fine while a phone code was the semver part alone (0.13.0 -> 1300):
    // once scripts/app-version.sh started appending a build number (0.13.0 -> 1300000), the
    // watch's 0.13.0 code landed on 2300072 - which is exactly what the phone's v0.23.0-dev.72
    // would later ask for. Reserving a decade above every phone code it can produce is the
    // only version of this that cannot come back.
    podshelfWearOffset = 1_000_000_000
    podshelfWearVersionCode = podshelfVersionCode + podshelfWearOffset

    // Enforced here rather than by inspecting the built bundles, because nothing downstream
    // can see it clearly: Play's rejection names the upload rather than the codes, and an .aab
    // is not an APK - aapt2 cannot read one, so a workflow step that tries looks like it
    // passed.
    //
    // Checking the offset rather than this one pair of numbers. The old check asked whether
    // the two codes were equal, which a constant non-zero offset makes impossible - it could
    // not fail, and so it did not notice the overlap above. These two can.
    if (podshelfVersionCode >= podshelfWearOffset) {
        throw new GradleException(
                "Phone versionCode ${podshelfVersionCode} has reached the range reserved for " +
                        "the watch (${podshelfWearOffset}). Raise podshelfWearOffset, and note " +
                        'that every watch release so far used the old one.')
    }
    if (podshelfWearVersionCode > 2_100_000_000) {
        throw new GradleException(
                "Watch versionCode ${podshelfWearVersionCode} exceeds the 2100000000 Play and " +
                        'the Android platform allow.')
    }
    minSdkVersion = 26
    compileSdkVersion = 37
    targetSdkVersion = 37
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
    androidx_core_ktx_version = '1.18.0'
    androidx_media_version = '1.7.1'
    exoplayer_version = '2.18.7' // DEPRECATED: kept for reference; replaced by media3
    media3_version = '1.9.2'
    glide_version = '5.0.5'
    androidx_work_version = '2.10.5'
    junit_version = '4.13.2'
    jackson_version = '2.21.1'
    kotlinx_serialization_version = '1.10.0'
    play_services_wearable_version = '20.0.1'
    okhttp_version = '5.3.0'
    compose_bom_version = '2026.09.00'
    wear_compose_version = '1.7.1'
    kotlin_version = '2.3.20'
    kotlin_coroutines_version = '1.10.2'
    test_runner_version = '1.1.0'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    androidx_window_version = '1.3.0'
    androidx_lifecycle_version = '2.11.0'
    ksp_version = '2.3.6'
}
