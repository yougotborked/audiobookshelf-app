ext {
    // Play rejects a versionCode it has already seen and will not accept one lower than the
    // track's current release, so it has to move forward on every upload. The publish workflow
    // derives both from the git tag that triggered it (v1.2.3 -> 10203 / "1.2.3"). A local or
    // debug CI build keeps the checked-in values.
    //
    // Hoisted here rather than left in app/build.gradle because the wear module ships under the
    // same applicationId and derives its own code from this one.
    podshelfVersionCode = (System.getenv('PODSHELF_VERSION_CODE') ?: '116') as Integer

    // The watch's version code, which must NOT equal the phone's.
    //
    // Play treats the two artifacts as one listing with several device targets, and a version
    // code has to be unique across every form factor in the app - two bundles sharing one is
    // simply rejected. Higher than the phone's as well as different, because a watch can match
    // the phone artifact too and Play hands a device the highest code it qualifies for.
    //
    // A constant offset rather than a separate counter: it keeps the watch's codes increasing
    // exactly as often as the phone's, so neither can quietly fall behind its own last release,
    // and the phone code is still readable inside it.
    podshelfWearVersionCode = podshelfVersionCode + 1_000_000

    // Enforced here rather than by inspecting the built bundles, because nothing downstream
    // can see it clearly: Play's rejection names the upload rather than the codes, and an .aab
    // is not an APK - aapt2 cannot read one, so a workflow step that tries looks like it
    // passed. A collision can only arise from someone editing the line above, and this fails
    // the build the moment they do.
    if (podshelfWearVersionCode == podshelfVersionCode) {
        throw new GradleException(
                'The watch and phone version codes must differ: Play treats both artifacts as ' +
                        'one listing and rejects a release where they collide.')
    }
    podshelfVersionName = (System.getenv('PODSHELF_VERSION_NAME') ?: '0.12.0-beta') as String
    minSdkVersion = 26
    compileSdkVersion = 37
    targetSdkVersion = 37
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
    androidx_core_ktx_version = '1.18.0'
    androidx_media_version = '1.7.1'
    exoplayer_version = '2.18.7' // DEPRECATED: kept for reference; replaced by media3
    media3_version = '1.9.2'
    glide_version = '5.0.5'
    androidx_work_version = '2.10.5'
    junit_version = '4.13.2'
    jackson_version = '2.21.1'
    kotlinx_serialization_version = '1.10.0'
    play_services_wearable_version = '20.0.1'
    okhttp_version = '5.3.0'
    compose_bom_version = '2026.09.00'
    wear_compose_version = '1.7.1'
    kotlin_version = '2.3.20'
    kotlin_coroutines_version = '1.10.2'
    test_runner_version = '1.1.0'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    androidx_window_version = '1.3.0'
    androidx_lifecycle_version = '2.11.0'
    ksp_version = '2.3.6'
}
