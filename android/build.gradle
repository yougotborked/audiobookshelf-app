// Top-level build file where you can add configuration options common to all sub-projects/modules.

apply from: "variables.gradle"

def agpVersion = findProperty('agpVersion') ?: '9.4.1'

buildscript {
  // Versions must be declared here — buildscript{} is evaluated before apply from: "variables.gradle"
  ext.kotlin_version = '2.3.20'
  ext.ksp_version = '2.3.6'
  repositories {
        google()
        mavenCentral()
    }
    dependencies {
      classpath 'com.google.gms:google-services:4.4.4'
      classpath "com.android.tools.build:gradle:${agpVersion}"
      classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
      classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
      classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
      classpath "io.github.takahirom.roborazzi:roborazzi-gradle-plugin:1.77.0"
      classpath "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:$ksp_version"

      // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Capacitor 9.0.0-beta.0 split Cordova support out of :capacitor-android into its own module,
// and the new module lost a dependency in the move. Its sources import AppCompatActivity, and
// its build file even defines `androidxAppCompatVersion` - but never adds AppCompat to its
// dependencies. In 8 the same code sat inside :capacitor-android, which had it. The build fails:
//
//   MockCordovaInterfaceImpl.java:4: error: package androidx.appcompat.app does not exist
//
// That build file is under node_modules/ and not ours to edit, so the dependency is supplied
// from here instead, using the same AppCompat version the rest of the app is forced to.
//
// Remove when a Capacitor 9 release adds the dependency itself - check by deleting this block
// and running :app:assembleDebug.
subprojects {
    if (name == 'capacitor-cordova-android') {
        afterEvaluate {
            dependencies {
                implementation "androidx.appcompat:appcompat:${rootProject.ext.androidxAppCompatVersion}"
            }
        }
    }
}

tasks.register('clean', Delete) {
  delete rootProject.layout.buildDirectory
}

