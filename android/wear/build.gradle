// The Wear OS app: standalone playback on the watch, so a run does not need the phone.
//
// A separate module rather than a flavour of :app. The phone app is a Capacitor webview, and a
// watch cannot usefully run one - the UI has to be native, the player is its own service, and
// the two share no screens. What they will share is the server they talk to.
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'io.github.takahirom.roborazzi'

android {
    namespace "com.podshelf.wear"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.podshelf.app"
        // Wear OS 3 and up. The watch this is being built for runs Wear OS 5, but there is no
        // reason to exclude the Wear 3/4 devices that can run the same code.
        minSdkVersion 30
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.podshelfWearVersionCode
        versionName rootProject.ext.podshelfVersionName
    }

    // The Wearable Data Layer only delivers between apps that share BOTH an applicationId and a
    // signing certificate. The phone app signs debug builds with the repository's checked-in
    // keystore, so this module has to use the same one rather than AGP's default at
    // ~/.android/debug.keystore - otherwise a locally built pair looks identical, installs
    // fine, and silently exchanges nothing. CI happens to agree today only because the workflow
    // copies the keystore into place first, which is luck rather than configuration.
    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // The same upload key as the phone app, from the same environment. Play requires one
        // signature across every artifact in a listing, so a watch bundle signed with anything
        // else - or with nothing - is rejected after the upload rather than before it.
        release {
            def keystorePath = System.getenv('PODSHELF_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('PODSHELF_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PODSHELF_KEY_ALIAS')
                keyPassword System.getenv('PODSHELF_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            signingConfig signingConfigs.debug
        }
        release {
            // Only attached when the key is present, so `./gradlew bundleRelease` on a laptop
            // without the secrets still configures and simply comes out unsigned.
            if (System.getenv('PODSHELF_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
            // On, unlike :app. A watch has a real storage budget, and this module's
            // dependencies - Compose, media3 - are almost entirely dead weight without
            // shrinking: 33MB unminified for what is a list and a player, against 1.2MB with
            // R8. The only thing needing a keep rule is kotlinx.serialization's generated
            // serializers; see proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
    }

    testOptions {
        unitTests {
            // Roborazzi renders the real composables through Robolectric, which needs the
            // module's resources on the unit-test classpath to do it.
            includeAndroidResources = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlin {
        jvmToolchain(21)
    }
}

dependencies {
    implementation project(':wear-sync')
    implementation "com.google.android.gms:play-services-wearable:$rootProject.ext.play_services_wearable_version"
    implementation "androidx.core:core-ktx:$rootProject.ext.androidx_core_ktx_version"
    implementation platform("androidx.compose:compose-bom:$rootProject.ext.compose_bom_version")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.wear.compose:compose-material:$rootProject.ext.wear_compose_version"
    implementation "androidx.wear.compose:compose-foundation:$rootProject.ext.wear_compose_version"
    implementation "androidx.activity:activity-compose:$rootProject.ext.androidxActivityVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$rootProject.ext.androidx_lifecycle_version"

    // Playback on the watch is its own service; nothing is shared with the phone's player.
    implementation "androidx.media3:media3-exoplayer:$rootProject.ext.media3_version"
    implementation "androidx.media3:media3-session:$rootProject.ext.media3_version"

    // WorkManager - holds the download pass until the watch is on Wi-Fi
    implementation "androidx.work:work-runtime-ktx:$rootProject.ext.androidx_work_version"
    implementation "com.squareup.okhttp3:okhttp:$rootProject.ext.okhttp_version"

    testImplementation "junit:junit:$rootProject.ext.junit_version"

    // Renders the watch's own composables to PNG without a device. There is no Wear emulator
    // here - no KVM, so one would be software-rendered - and the web screenshot harness cannot
    // help: it drives the Nuxt app in a browser, and this module is native Compose.
    testImplementation "org.robolectric:robolectric:4.13"
    testImplementation "io.github.takahirom.roborazzi:roborazzi:1.77.0"
    testImplementation "io.github.takahirom.roborazzi:roborazzi-compose:1.77.0"
    testImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}

// scripts/test-android.sh runs every module's test task in one invocation, so a `--tests`
// filter naming a class in another module must not fail this one.
tasks.withType(Test).configureEach {
  filter {
    failOnNoMatchingTests = false
  }
}
