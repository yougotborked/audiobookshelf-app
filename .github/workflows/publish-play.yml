name: Publish to Play

# Two cadences, because "can my testers have this" and "this is a release" are different
# decisions:
#
#   push to master -> internal testing. Automatic, every commit. Internal testing goes live to
#       the handful of accounts on the list within minutes and skips Google's review entirely,
#       so there is nothing to weigh up per commit - the same build already goes to the Releases
#       page as a debug APK, and this just puts it somewhere a phone can install it from Play
#       without sideloading.
#
#   push a tag     -> closed testing (alpha). Deliberate, and reviewed by Google before testers
#       see it, which is the reason it stays tag-gated.
#
#       git tag v0.14.0 && git push origin v0.14.0
#
# workflow_dispatch can send any ref to any track for the off-cycle case.
#
# The version comes from scripts/app-version.sh in every case - see that script for the
# versionCode scheme and why master builds need a build component of their own. The short
# version: Play rejects a versionCode it has seen before, and publishing on every master push
# means a lot more uploads than there are tags.
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track to publish to'
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      include_wear:
        description: 'Upload the Wear OS bundle too (needs the Wear form factor set up in Play Console first)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# Grouped per ref rather than one global queue, so a tag never waits behind a backlog of
# master builds. Within master, a superseded internal build is worth nothing - the next commit
# is already building - so those cancel; a tag release never does.
concurrency:
  group: publish-play-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/master' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: play
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
        with:
          # Full history and tags, because scripts/app-version.sh derives the version by asking
          # git for the newest tag and counting commits since it. The default shallow clone has
          # neither, and the script would fall back to 0.0.0-untagged / versionCode 1 - which
          # Play would reject, after a full release build, with nothing to point at.
          fetch-depth: 0

      # Fail here rather than three minutes into a Gradle build with an opaque signing error,
      # or - worse - succeed and upload something unsigned.
      - name: Check required secrets are present
        env:
          KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
          SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=()
          [ -n "$KEYSTORE" ]          || missing+=(PLAY_UPLOAD_KEYSTORE_BASE64)
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=(PLAY_KEYSTORE_PASSWORD)
          [ -n "$KEY_ALIAS" ]         || missing+=(PLAY_KEY_ALIAS)
          [ -n "$KEY_PASSWORD" ]      || missing+=(PLAY_KEY_PASSWORD)
          [ -n "$SERVICE_ACCOUNT" ]   || missing+=(PLAY_SERVICE_ACCOUNT_JSON)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing secrets: ${missing[*]}. See docs/PLAY_STORE.md for how to create them."
            exit 1
          fi

      - name: Derive the version
        id: version
        run: |
          # Captured into a variable first, then eval'd. `eval "$(scripts/app-version.sh)"`
          # reads better and silently ignores a failure: eval reports its own exit status, not
          # the substitution's, so even under `set -e` a script that bailed would leave both
          # variables empty and the build would carry on and upload versionCode "" - whereas a
          # plain assignment propagates the status and stops the job here.
          derived=$(scripts/app-version.sh)
          eval "$derived"

          # Belt and braces: an empty code is the one value that would get past the above and
          # still be wrong, and the error Play returns for it names nothing useful.
          if [ -z "${PODSHELF_VERSION_NAME:-}" ] || [ -z "${PODSHELF_VERSION_CODE:-}" ]; then
            echo "::error::scripts/app-version.sh produced no version: $derived"
            exit 1
          fi

          echo "name=$PODSHELF_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$PODSHELF_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Publishing $PODSHELF_VERSION_NAME as versionCode $PODSHELF_VERSION_CODE"

      - name: Use Node.js 24.x with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # A gate, because publishing is now automatic.
      #
      # When a tag was the only way to reach Play, a human had decided the commit was good
      # before this workflow ran. Every push to master publishing to internal testing removes
      # that judgement, and Play's internal track has no review of its own - a broken commit
      # would be on testers' phones minutes later. So the same checks that gate a pull request
      # gate a publish.
      #
      # Lint, typecheck and the JS tests only: the Kotlin tests are left to the Build APK
      # workflow on the same commit, because running them here would install a 400MB SDK that
      # the release build does not otherwise need.
      - name: Run the checks that gate a publish
        run: |
          npm run lint
          npm run typecheck
          npm run test:unit

      - name: Build Nuxt project (static)
        run: npm run generate

      - name: Copy web to Android (Capacitor)
        run: npx cap sync android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Written outside the workspace so it cannot be picked up by anything that archives the
      # checkout, and removed again in the always() step at the end.
      - name: Decode the upload keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          keystore="${RUNNER_TEMP}/podshelf-upload.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "path=$keystore" >> "$GITHUB_OUTPUT"

      - name: Build signed AAB
        working-directory: android
        env:
          PODSHELF_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          PODSHELF_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PODSHELF_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PODSHELF_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
          PODSHELF_VERSION_CODE: ${{ steps.version.outputs.code }}
          PODSHELF_VERSION_NAME: ${{ steps.version.outputs.name }}
        # Unqualified, so it builds :app and :wear. Both go into the same Play listing: one
        # package name, one signature, and a device is offered whichever artifact it qualifies
        # for.
        run: ./gradlew --no-daemon --build-cache bundleRelease

      # An unsigned bundle is accepted by Gradle and rejected by Play with a far less obvious
      # message, so confirm the signature exists before uploading.
      - name: Verify both bundles are signed
        run: |
          for aab in android/app/build/outputs/bundle/release/app-release.aab \
                     android/wear/build/outputs/bundle/release/wear-release.aab; do
            test -f "$aab" || { echo "::error::No bundle at $aab"; exit 1; }
            if ! unzip -l "$aab" | grep -q 'META-INF/.*\.RSA\|META-INF/.*\.EC\|META-INF/MANIFEST.MF'; then
              echo "::error::$aab does not look signed"
              exit 1
            fi
            ls -la "$aab"
          done

      # Which bundles go up.
      #
      # Play will not accept a Wear OS artifact until the Wear form factor has been added to the
      # app in Play Console and the listing carries at least one Wear screenshot - and it fails
      # the whole release, not just that artifact, so a phone release would be blocked by an
      # unconfigured watch listing. Leaving the watch out is therefore a supported way to ship.
      - name: Decide which bundles to upload
        id: bundles
        env:
          # Off for a tag until the watch listing exists in Play Console - the Wear form factor
          # and at least one Wear screenshot. Play fails the WHOLE release if a Wear artifact
          # arrives before those, so leaving this on would make every tag take the phone release
          # down with it. Flip to `true` once docs/PLAY_STORE.md's three steps are done.
          INCLUDE_WEAR: ${{ github.event_name == 'workflow_dispatch' && inputs.include_wear || false }}
        run: |
          phone=android/app/build/outputs/bundle/release/app-release.aab
          wear=android/wear/build/outputs/bundle/release/wear-release.aab
          {
            echo 'files<<EOF'
            echo "$phone"
            if [ "$INCLUDE_WEAR" = "true" ]; then
              echo "$wear"
              echo "::notice::Uploading the phone and Wear OS bundles"
            else
              echo "::notice::Uploading the phone bundle only; the Wear OS bundle was built but not sent"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Upload to Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.podshelf.app
          releaseFiles: ${{ steps.bundles.outputs.files }}
          # Where a tag publishes to, when no track was chosen by hand.
          #
          # alpha is Play's closed testing track, which is where Podshelf's testers are. It was
          # internal while there were none; internal caps at a list of individual email
          # addresses and is the wrong shape for a beta someone can be invited to.
          #
          # Promoting between tracks afterwards is a Play Console action, not a re-upload: a
          # version code can only be uploaded once, so this chooses where it lands, not where it
          # can ever go.
          #
          # A tag is a release and goes to closed testing; a master push is for the internal
          # list. `inputs.track` is empty unless this was dispatched by hand, so the dispatch
          # choice wins where there is one.
          track: ${{ inputs.track || (startsWith(github.ref, 'refs/tags/') && 'alpha' || 'internal') }}
          status: completed
          releaseName: ${{ steps.version.outputs.name }}

      - name: Keep the bundle with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podshelf-aab-${{ steps.version.outputs.name }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/wear/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Remove the keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/podshelf-upload.jks"
