name: Sync Play listing

# The listing - title, descriptions, icon, feature graphic, screenshots - is kept in
# docs/store/ and pushed to Play from here, so it is reviewable in a diff rather than typed
# into the Console and silently drifting from the app.
#
# It only *sends* on a tag. On master it validates and sends nothing, and that distinction is
# the whole point of this file's shape:
#
# Committing any Play edit while a release is in review cancels that submission and opens a new
# one covering everything still unreviewed. The listing edit does not mention a track - the
# script never touches tracks - but Play folds the pending Closed testing release into it
# anyway. So eight listing syncs on master between Oct 23 and Oct 29 produced eight
# "Closed testing - Alpha, Store Listing, App Content, Store settings" submissions, seven
# cancelled and one in review, and versionCode 1300 never finished review because every push
# to master restarted it.
#
# Validating on master is still worth the twenty seconds: the script checks Play's length
# limits, and finding out at tag time that a description is 40 characters over is worse.
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate only, send nothing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-play-listing
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: play
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Until the Play app exists and the secret is set there is nothing to sync, and failing
      # every push to master over it would be noise. A dry run still validates the content.
      - name: Sync
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set - validating the listing only."
            node scripts/sync-play-listing.mjs --dry-run
            exit 0
          fi

          # A plain push to master validates and stops. Sending here is what was restarting the
          # Closed testing review on every commit; the listing now goes up with the release it
          # belongs to.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ startsWith(github.ref, 'refs/tags/') }}" != "true" ]; then
            echo "::notice::Push to master - validating the listing, sending nothing. A tag sends it."
            node scripts/sync-play-listing.mjs --dry-run
            exit 0
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/sync-play-listing.mjs --dry-run
          else
            node scripts/sync-play-listing.mjs
          fi
