name: Build APK

on:
  push:
    paths-ignore:
      - 'ios/**'
      - 'readme.md'
  pull_request:
    paths-ignore:
      - 'ios/**'
      - 'readme.md'

# Minimize default token and avoid unneeded scopes
permissions:
  contents: read

# Cancel superseded runs per ref to save minutes
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback on the Nuxt side. Runs in parallel with the Android build because none of
  # these checks need Java, the Android SDK, or a Capacitor sync.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
        with:
          # Tags, so scripts/app-version.sh can name the build after the release it follows.
          # The default shallow checkout fetches none, which is how the version silently became
          # "0.0.0-untagged" - or, before the derivation moved out of Gradle, failed the build.
          fetch-depth: 0

      - name: Use Node.js 24.x with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Compares against scripts/typecheck-baseline.json: fails on a NEW type error, not on
      # the type errors the Nuxt 2 -> 3 migration has not got to yet.
      - name: Typecheck (vs. baseline)
        run: npm run typecheck

      - name: Check i18n files are alphabetized
        run: npm run check:i18n

      - name: Unit tests
        run: npm run test:unit

  main:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
        with:
          # Tags, so scripts/app-version.sh can name the build after the release it follows.
          # The default shallow checkout fetches none, which is how the version silently became
          # "0.0.0-untagged" - or, before the derivation moved out of Gradle, failed the build.
          fetch-depth: 0

      - name: Use Node.js 24.x with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Nuxt deps
      - name: Install dependencies
        run: npm ci

      # Before the web build, not after it. nuxt.config.ts reads PODSHELF_VERSION_NAME when
      # `npm run generate` runs, and this step used to sit after it - so the webview re-derived
      # its own version and the drawer showed the bare tag while Android's versionName carried
      # the commit count. Same derivation either way; only the order was wrong.
      - name: Derive the app version from the newest tag
        run: scripts/app-version.sh >> "$GITHUB_ENV"

      - name: Build Nuxt project (static)
        run: npm run generate

      - name: Copy web to Android (Capacitor)
        run: npx cap sync

      # Single source of truth for Gradle caching & config-cache
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      # compileSdk 37 ships as the minor-versioned platforms;android-37.0 package, which an
      # older sdkmanager cannot even see - the minor-versioned SDKs introduced version 4 of the
      # remote repository XML. The script updates the command-line tools when that is the case,
      # and is the same one a bare container runs, so CI and a laptop install the same packages.
      - name: Install the Android SDK packages the build needs
        run: scripts/install-android-sdk.sh

      - name: Setup debug keystore
        run: |
          mkdir -p "$HOME/.android"
          cp android/debug.keystore "$HOME/.android/debug.keystore"

      # Run the tasks in one Gradle invocation so task outputs/configuration state can be reused
      # within the same build execution instead of crossing invocation boundaries.
      # testDebugUnitTest comes before assembleDebug so a failing test fails the job rather
      # than producing an APK nobody should install.
      # :wear-sync is a plain JVM module, so its tests hang off `test` rather than
      # `testDebugUnitTest` and have to be named explicitly or they silently do not run.
      - name: Run static analysis + unit tests + build Android apps (Debug)
        working-directory: android
        run: ./gradlew --no-daemon --build-cache --configuration-cache staticAnalysis testDebugUnitTest :wear-sync:test assembleDebug

      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: |
            android/app/build/reports/tests/testDebugUnitTest/**
            android/app/build/test-results/testDebugUnitTest/**
            android/wear/build/reports/tests/testDebugUnitTest/**
            android/wear/build/test-results/testDebugUnitTest/**
            android/wear-sync/build/reports/tests/test/**
            android/wear-sync/build/test-results/test/**
          if-no-files-found: ignore
          retention-days: 7

      # Both APKs carry the same build stamp, so a phone and watch pair downloaded together
      # are visibly from the same commit. They share an applicationId and a versionCode, and
      # installing mismatched halves is the kind of thing that wastes an evening.
      - name: Rename APKs with timestamp + short SHA
        run: |
          build="$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          mv -v android/app/build/outputs/apk/debug/app-debug.apk \
                android/app/build/outputs/apk/debug/podshelf-${build}.apk
          mv -v android/wear/build/outputs/apk/debug/wear-debug.apk \
                android/wear/build/outputs/apk/debug/podshelf-wear-${build}.apk

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: podshelf-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      # Separate from the phone artifact on purpose: the publish job builds its download page
      # from `ls *apk` in the artifact it downloads, so a second APK in there would break it.
      - name: Upload watch app artifact
        uses: actions/upload-artifact@v4
        with:
          name: podshelf-wear-apk
          path: android/wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: main
    runs-on: ubuntu-latest
    # Only publish for commits pushed to the master branch
    if: github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write
      contents: read

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
        with:
          # Tags, so scripts/app-version.sh can name the build after the release it follows.
          # The default shallow checkout fetches none, which is how the version silently became
          # "0.0.0-untagged" - or, before the derivation moved out of Gradle, failed the build.
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: podshelf-apk
          path: ./ghpages

      - name: Download watch APK artifact
        uses: actions/download-artifact@v4
        with:
          name: podshelf-wear-apk
          path: ./ghpages

      - name: Prepare test page resources
        run: |
          mkdir -p ghpages
          # copy logo + template from the repo into the ghpages folder
          cp static/logo.svg ghpages/logo.svg || true
          cp .github/testing-page-template.html ghpages/index.html
          # Play requires a reachable privacy policy URL for the listing, so it is published
          # alongside the test page rather than kept in a gist that can quietly disappear.
          cp .github/privacy-policy.html ghpages/privacy.html

      - name: Build test page
        working-directory: ghpages
        run: |
          sed -i "s/__DATE__/$(date)/g" index.html
          sed -i "s/__COMMIT__/$(git rev-parse --short HEAD)/g" index.html
          # Matched by prefix rather than by `ls *apk`, which now finds two files and would
          # substitute both names into one href.
          sed -i "s/__APK__/$(ls podshelf-[0-9]*.apk | head -1 | xargs -n1 basename)/g" index.html
          sed -i "s/__WEAR_APK__/$(ls podshelf-wear-*.apk | head -1 | xargs -n1 basename)/g" index.html
          # Replace repository placeholder so forks point to their own repo (owner/name)
          sed -i "s|__REPO__|${GITHUB_REPOSITORY}|g" index.html privacy.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./ghpages

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  release:
    needs: main
    runs-on: ubuntu-latest
    # Only publish releases for commits pushed to master
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
        with:
          # Tags, so scripts/app-version.sh can name the build after the release it follows.
          # The default shallow checkout fetches none, which is how the version silently became
          # "0.0.0-untagged" - or, before the derivation moved out of Gradle, failed the build.
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: podshelf-apk
          path: ./apk

      - name: Download watch APK artifact
        uses: actions/download-artifact@v4
        with:
          name: podshelf-wear-apk
          path: ./wear-apk

      - name: Get APK filenames and commit info
        id: info
        run: |
          echo "apk=$(ls apk/*.apk | head -1)" >> "$GITHUB_OUTPUT"
          echo "wearApk=$(ls wear-apk/*.apk | head -1)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      # Delete the existing 'latest' tag+release (if any) then recreate it.
      # This keeps the Releases page to a single entry instead of accumulating
      # one release per commit. Force-pushing a tag to master is safe here
      # because 'latest' is a rolling pointer, not a semantic version.
      - name: Delete existing 'latest' release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true
          # The local one as well. This checkout uses fetch-depth: 0, so it already has
          # `latest` from the previous run; deleting only the remote leaves a local tag with
          # no counterpart, and `gh release create` refuses that outright:
          #
          #   tag latest exists locally but has not been pushed ... please push it before
          #   continuing or specify the `--target` flag
          #
          # A race, which is why it passed for weeks before biting: it depends on whether the
          # checkout happened to fetch the tag before this step removed it.
          git tag -d latest 2>/dev/null || true
      - name: Create 'latest' release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Debug builds from `master` at %s\n\nCommit: [%s](https://github.com/%s/commit/%s)\n\n| File | Install on |\n| --- | --- |\n| `podshelf-*.apk` | Your phone |\n| `podshelf-wear-*.apk` | Your Wear OS watch |\n\nThe watch app streams and downloads from your Audiobookshelf server directly, but the phone\napp is what sends it your server details and your queue, so install both - the watch cannot\nbe set up on its own.\n\n> This release is automatically overwritten on every push to master.\n' \
            "${{ steps.info.outputs.date }}" \
            "${{ steps.info.outputs.sha }}" \
            "${{ github.repository }}" \
            "${{ github.sha }}" > release-notes.md
          # --target pins the release to this commit, so creating it does not depend on local
          # tag state at all. Belt and braces with the delete above: either alone fixes today's
          # failure, together the step is idempotent whatever the checkout fetched.
          gh release create latest \
            --target "${{ github.sha }}" \
            --title "Latest build (${{ steps.info.outputs.sha }})" \
            --notes-file release-notes.md \
            --prerelease \
            "${{ steps.info.outputs.apk }}" \
            "${{ steps.info.outputs.wearApk }}"
